<form (ngSubmit)="register()" #registerForm="ngForm">

  <div class="left">
    <div>
      <h1>Registrarse</h1>

      <input type="text" name="name" placeholder="Nom" [(ngModel)]="user.name" required />

      <input type="text" name="surname" placeholder="Cognom" [(ngModel)]="user.surname" />

      <input type="number" name="age" placeholder="Edat" [(ngModel)]="user.age" />

      <input type="text" name="speciality" placeholder="Especialitat" [(ngModel)]="user.speciality" required />

      <input type="text" name="username" placeholder="Nom d'usuari" [(ngModel)]="user.username" required />

      <input type="password" name="password" placeholder="Contrasenya" [(ngModel)]="user.password" (ngModelChange)="validatePassword($event)" required />

      <!-- Mensajes de validación de contraseña -->
      @if (user.password) {
        <div class="password-requirements">
          <div [class.valid]="passwordErrors.hasNumber" [class.invalid]="!passwordErrors.hasNumber">
            {{ passwordErrors.hasNumber ? '✓' : '✗' }} Debe contener al menos un número
          </div>
          <div [class.valid]="passwordErrors.hasUppercase" [class.invalid]="!passwordErrors.hasUppercase">
            {{ passwordErrors.hasUppercase ? '✓' : '✗' }} Debe contener al menos una mayúscula
          </div>
        </div>
      }

      <select name="role" [(ngModel)]="user.role" required>
        <option value="" disabled selected>Selecciona un rol</option>
        <option value="DOCTOR">Doctor</option>
        <option value="ADMIN">Admin</option>
      </select>

      @if (successMessage) {
        <div class="status-message success">{{ successMessage }}</div>
      }
      @if (errorMessage) {
        <div class="status-message error">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="registerForm.invalid || !isPasswordValid()">
        Registrarse
      </button>
    </div>
  </div>

  <div class="right">
    <div>
      <img src="/img/logo.png" />
    </div>
  </div>

</form>
